name: Import personal website

on:
  push:
    branches: ["main"]
    paths:
      - "ziqiwei.zip"
      - ".github/workflows/import-site.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify website archive
        run: |
          test -f ziqiwei.zip || { echo "ziqiwei.zip was not found in the repository root."; exit 1; }

      - name: Extract website
        run: |
          rm -rf /tmp/ziqiwei-import
          mkdir -p /tmp/ziqiwei-import
          unzip -q ziqiwei.zip -d /tmp/ziqiwei-import
          test -f /tmp/ziqiwei-import/ziqiwei/index.html || { echo "Expected ziqiwei/index.html inside the archive."; exit 1; }

      - name: Replace repository contents with website
        run: |
          rsync -a --delete --exclude='.git/' --exclude='.github/workflows/' /tmp/ziqiwei-import/ziqiwei/ ./

      - name: Commit imported website
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Publish Ziqi Wei personal website"
          git push
