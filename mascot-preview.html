<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mascot preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..800&family=Newsreader:opsz,wght@6..72,400..700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#f7fdff;font-family:Manrope,sans-serif;color:#20323d}.wrap{max-width:1120px;margin:0 auto;padding:52px 32px}h1{font:600 38px/1.1 Newsreader,serif;color:#145f9f;margin:0 0 34px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px}.card{min-height:330px;background:rgba(255,255,255,.86);border:1px solid rgba(0,161,222,.18);border-radius:18px;display:flex;align-items:center;justify-content:center;box-shadow:0 12px 36px rgba(20,90,120,.06)}.mascot{display:flex;align-items:flex-end;gap:18px}.cat{width:190px;height:auto}.acc{width:175px;height:auto;transform:translateY(14px)}.hi{font-family:"Chalkboard SE","Comic Sans MS","Arial Rounded MT Bold",cursive;font-size:82px;font-weight:700;color:#12B8CF;letter-spacing:-.055em;transform:translateY(4px) rotate(-2deg);white-space:nowrap}.label{position:absolute;margin-top:286px;font-size:13px;color:#6b7e88;text-transform:uppercase;letter-spacing:.08em}.card{position:relative}@media(max-width:700px){.grid{grid-template-columns:1fr}.cat{width:150px}.acc{width:135px}.hi{font-size:62px}}
</style>
</head>
<body><div class="wrap"><h1>Mascot + separate webpage accessory</h1><div class="grid">
<div class="card"><div class="mascot"><span class="hi">Hi!</span><img class="cat" src="assets/mascot/cat.svg"></div><div class="label">About Me</div></div>
<div class="card"><div class="mascot"><img class="acc" src="assets/mascot/book.svg"><img class="cat" src="assets/mascot/cat.svg"></div><div class="label">Publications</div></div>
<div class="card"><div class="mascot"><img class="acc" src="assets/mascot/yarn.svg"><img class="cat" src="assets/mascot/cat.svg"></div><div class="label">Research Experiences</div></div>
<div class="card"><div class="mascot"><img class="acc" src="assets/mascot/camera.svg"><img class="cat" src="assets/mascot/cat.svg"></div><div class="label">Photography</div></div>
</div></div></body></html>
